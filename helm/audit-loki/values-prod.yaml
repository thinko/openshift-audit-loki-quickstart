# values-prod.yaml — Production environment (30+ nodes, hundreds of projects)
# Usage: helm upgrade --install audit-loki ./helm/audit-loki \
#          -f helm/audit-loki/values.yaml \
#          -f helm/audit-loki/values-prod.yaml

lokiStack:
  size: 1x.medium
  # Total resource footprint: 54 vCPU, 139 Gi memory, 590 Gi disk
  # Supports: 2 TB/day ingest, 25-75 QPS at 200ms
  retentionDays: 30
  auditRetentionDays: 90
  queryLimits:
    maxEntriesLimitPerQuery: 20000
    maxChunksPerQuery: 8000000
    maxQuerySeries: 2000
  ingestionLimits:
    ingestionRate: 16
    ingestionBurstSize: 24

infrastructure:
  enabled: true
  retentionDays: 30
  dropProbeNoise: true
  dropDnsNoise: true

# Enable application logging in production if teams opt in.
application:
  enabled: false
  retentionDays: 14

# Production alerting with tighter thresholds and notification routing.
alerting:
  enabled: true
  thresholds:
    componentNotReadyFor: 5m
    errorRatePercent: 3
    pvcUsagePercent: 80
    restartCount: 2
    ingestionStoppedFor: 10m
    filterEffectivenessMinPercent: 60
    ingestionSpikeMultiplier: 2
  # Uncomment and configure for production notifications:
  # receiver:
  #   enabled: true
  #   name: loki-audit-pagerduty
  #   webhookUrl: "https://events.pagerduty.com/generic/..."
  #   repeatInterval: 4h
  #   criticalRepeatInterval: 30m
