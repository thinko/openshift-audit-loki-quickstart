# Default values for audit-loki.
# Pass Azure credentials via --set, a private values file, or existingSecret.
# Never commit real account keys to git.

nameOverride: ""
fullnameOverride: ""

# OLM channels must match between Loki and Cluster Logging Operators.
# List channels: oc get packagemanifest loki-operator -n openshift-marketplace
operator:
  channel: stable-6.5
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  createNamespaces: true
  # Set to true ONLY on clusters with no existing logging operators.
  # A second OperatorGroup in the same namespace breaks OLM (forces Manual
  # InstallPlan approval, causes CSV install loops). Check first:
  #   oc get operatorgroup -n openshift-logging
  createOperatorGroups: false
  createSubscriptions: true

lokiStack:
  name: logging-loki
  namespace: openshift-logging
  # Size profiles (cannot change the 1x prefix):
  #   1x.extra-small  — 100 GB/day, 14 vCPU, 31 Gi  (sandbox / ≤10 nodes)
  #   1x.small        — 500 GB/day, 34 vCPU, 67 Gi  (test / 10-30 nodes)
  #   1x.medium       — 2 TB/day,   54 vCPU, 139 Gi (prod / 30+ nodes)
  size: 1x.extra-small
  storageClassName: managed-csi
  retentionDays: 7
  auditRetentionDays: 14
  schema:
    version: v13
    effectiveDate: "2024-10-01"
  # Query limits protect the querier from OOM on wide time-range queries.
  queryLimits:
    maxEntriesLimitPerQuery: 5000
    maxChunksPerQuery: 2000000
    maxQuerySeries: 500
  # Ingestion limits prevent a single tenant from overwhelming the cluster.
  ingestionLimits:
    ingestionRate: 4
    ingestionBurstSize: 6
    maxLabelNameLength: 1024
    maxLabelValueLength: 2048
    maxLabelNamesPerSeries: 30
    maxGlobalStreamsPerTenant: 0

# Object storage for Loki (Azure Blob). Prefer existingSecret in GitOps.
azure:
  existingSecret: ""
  environment: AzureGlobal
  accountName: ""
  accountKey: ""
  container: loki-audit
  # static | token | token-cco (token-cco is for Entra Workload ID / CCO)
  credentialMode: static

clusterLogForwarder:
  name: loki-audit
  namespace: openshift-logging
  collectorServiceAccount: logging-collector
  createRbac: true
  dataModel: Viaq
  tls:
    ca:
      configMapName: openshift-service-ca.crt
      key: service-ca.crt
  auditSources:
    - kubeAPI
    - openshiftAPI
    - ovn
  # When true, secret reads by human users pass through the filter.
  # System-account secret reads are always dropped.
  keepSecretReads: true
  drop:
    verbPattern: '^(get|list|watch)$'
    usernamePattern: '^system:(node|serviceaccount:kube-system|serviceaccount:openshift-.*)'
  kubeAPIAudit:
    omitStages:
      - RequestReceived
    dropUsers:
      - "system:node*"
      - "system:serviceaccount:kube-system:*"
      - "system:serviceaccount:openshift-*"

# Opt-in log pipelines. Audit is always enabled.
# Infrastructure is enabled for Cloud Ops visibility.
# Application is out of scope (customer manages app logging separately).
infrastructure:
  enabled: true
  retentionDays: 7
  # Drop high-volume infra noise (probe responses, kube-proxy sync, DNS lookups).
  dropProbeNoise: true
  dropDnsNoise: true

application:
  enabled: false
  retentionDays: 7

# Grafana Operator deployment. Disabled by default; enable for full
# LogQL query support, saved dashboards, and Explore mode.
grafana:
  enabled: false
  replicas: 1
  resources:
    requests:
      memory: 64Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 250m
  route:
    enabled: true

consolePlugin:
  enabled: false
  name: logging-view-plugin

# ── Alerting ──────────────────────────────────────────────────────
# PrometheusRule alerts for LokiStack health and audit pipeline.
# These target conditions unique to this deployment; built-in OCP
# alerts (KubeDeployment*, KubePodNotReady, etc.) are not duplicated.
alerting:
  enabled: true
  thresholds:
    # Duration before a Loki component down triggers critical.
    componentNotReadyFor: 5m
    # Loki 5xx error rate percentage threshold.
    errorRatePercent: 5
    # PVC usage percentage before warning.
    pvcUsagePercent: 85
    # Restart count in 30 minutes before warning.
    restartCount: 3
    # Duration of zero ingestion before alert fires.
    ingestionStoppedFor: 15m
    # Minimum audit filter effectiveness (percentage).
    filterEffectivenessMinPercent: 50
    # Multiplier over 1h average that constitutes an ingestion spike.
    ingestionSpikeMultiplier: 3
  # AlertmanagerConfig receiver (for notification routing).
  # Disabled by default — enable and configure per environment.
  receiver:
    enabled: false
    name: loki-audit-webhook
    webhookUrl: "http://placeholder.example.com/webhook"
    repeatInterval: 4h
    criticalRepeatInterval: 1h

# Extra labels applied to all rendered resources.
labels: {}
