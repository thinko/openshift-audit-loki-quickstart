apiVersion: loki.grafana.com/v1
kind: LokiStack
metadata:
  name: {{ .Values.lokiStack.name }}
  namespace: {{ include "audit-loki.lokiNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/component: lokistack
    {{- include "audit-loki.labels" . | nindent 4 }}
spec:
  managementState: Managed
  size: {{ .Values.lokiStack.size | quote }}
  storage:
    schemas:
      - version: {{ .Values.lokiStack.schema.version }}
        effectiveDate: {{ .Values.lokiStack.schema.effectiveDate | quote }}
    secret:
      name: {{ include "audit-loki.secretName" . }}
      type: azure
      credentialMode: {{ .Values.azure.credentialMode }}
  storageClassName: {{ .Values.lokiStack.storageClassName | quote }}
  tenants:
    mode: openshift-logging
  limits:
    global:
      retention:
        days: {{ .Values.lokiStack.retentionDays }}
      {{- with .Values.lokiStack.queryLimits }}
      queries:
        maxEntriesLimitPerQuery: {{ .maxEntriesLimitPerQuery | default 5000 }}
        maxChunksPerQuery: {{ .maxChunksPerQuery | default 2000000 }}
        maxQuerySeries: {{ .maxQuerySeries | default 500 }}
      {{- end }}
      {{- with .Values.lokiStack.ingestionLimits }}
      ingestion:
        ingestionRate: {{ .ingestionRate | default 4 }}
        ingestionBurstSize: {{ .ingestionBurstSize | default 6 }}
        maxLabelNameLength: {{ .maxLabelNameLength | default 1024 }}
        maxLabelValueLength: {{ .maxLabelValueLength | default 2048 }}
        maxLabelNamesPerSeries: {{ .maxLabelNamesPerSeries | default 30 }}
        maxGlobalStreamsPerTenant: {{ .maxGlobalStreamsPerTenant | default 0 }}
      {{- end }}
    tenants:
      audit:
        retention:
          days: {{ .Values.lokiStack.auditRetentionDays }}
      {{- if .Values.infrastructure.enabled }}
      infrastructure:
        retention:
          days: {{ .Values.infrastructure.retentionDays | default 7 }}
        {{- with .Values.lokiStack.queryLimits }}
        queries:
          maxEntriesLimitPerQuery: {{ .maxEntriesLimitPerQuery | default 5000 }}
          maxQuerySeries: {{ .maxQuerySeries | default 500 }}
        {{- end }}
      {{- end }}
      {{- if .Values.application.enabled }}
      application:
        retention:
          days: {{ .Values.application.retentionDays | default 7 }}
      {{- end }}
