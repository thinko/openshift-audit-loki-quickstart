{{- if .Values.grafana.enabled }}
---
# Grafana Operator Subscription (installs into openshift-operators)
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: grafana-operator
  namespace: openshift-operators
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "audit-loki.labels" . | nindent 4 }}
spec:
  channel: v5
  installPlanApproval: Automatic
  name: grafana-operator
  source: community-operators
  sourceNamespace: openshift-marketplace
---
# Grafana instance
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: loki-grafana
  namespace: {{ include "audit-loki.lokiNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    dashboards: "loki-audit"
    {{- include "audit-loki.labels" . | nindent 4 }}
spec:
  deployment:
    spec:
      replicas: {{ .Values.grafana.replicas }}
      template:
        spec:
          containers:
            - name: grafana
              resources:
                {{- toYaml .Values.grafana.resources | nindent 16 }}
  {{- if .Values.grafana.route.enabled }}
  route:
    metadata:
      annotations:
        haproxy.router.openshift.io/timeout: 5m
    spec:
      tls:
        termination: edge
  {{- end }}
  config:
    log:
      mode: console
      level: warn
    auth.anonymous:
      enabled: "true"
      org_role: Viewer
    dataproxy:
      timeout: "300"
---
# ServiceAccount for Prometheus queries
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-prometheus
  namespace: {{ include "audit-loki.lokiNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    {{- include "audit-loki.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-grafana-prometheus" (include "audit-loki.fullname" .) | trunc 63 | trimSuffix "-" }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    {{- include "audit-loki.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: grafana-prometheus
    namespace: {{ include "audit-loki.lokiNamespace" . }}
---
# ServiceAccount for LokiStack gateway queries
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-loki
  namespace: {{ include "audit-loki.lokiNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    {{- include "audit-loki.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-grafana-loki-tenant-view" (include "audit-loki.fullname" .) | trunc 63 | trimSuffix "-" }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    {{- include "audit-loki.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - loki.grafana.com
    resources:
      - application
      - audit
      - infrastructure
    resourceNames:
      - logs
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-grafana-loki-tenant-view" (include "audit-loki.fullname" .) | trunc 63 | trimSuffix "-" }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    {{- include "audit-loki.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-grafana-loki-tenant-view" (include "audit-loki.fullname" .) | trunc 63 | trimSuffix "-" }}
subjects:
  - kind: ServiceAccount
    name: grafana-loki
    namespace: {{ include "audit-loki.lokiNamespace" . }}
---
# Loki datasource — audit tenant (default). Gateway path encodes the tenant.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: loki
  namespace: {{ include "audit-loki.lokiNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    {{- include "audit-loki.labels" . | nindent 4 }}
spec:
  instanceSelector:
    matchLabels:
      dashboards: "loki-audit"
  datasource:
    name: Loki
    type: loki
    access: proxy
    url: https://logging-loki-gateway-http.{{ include "audit-loki.lokiNamespace" . }}.svc:8080/api/logs/v1/audit
    isDefault: true
    jsonData:
      httpHeaderName1: Authorization
      maxLines: 1000
      timeout: 180
      tlsSkipVerify: true
  valuesFrom:
    - targetPath: "secureJsonData.httpHeaderValue1"
      valueFrom:
        secretKeyRef:
          name: grafana-loki-gateway-token
          key: token
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: loki-infrastructure
  namespace: {{ include "audit-loki.lokiNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    {{- include "audit-loki.labels" . | nindent 4 }}
spec:
  instanceSelector:
    matchLabels:
      dashboards: "loki-audit"
  datasource:
    name: Loki-Infrastructure
    type: loki
    access: proxy
    url: https://logging-loki-gateway-http.{{ include "audit-loki.lokiNamespace" . }}.svc:8080/api/logs/v1/infrastructure
    jsonData:
      httpHeaderName1: Authorization
      maxLines: 1000
      timeout: 180
      tlsSkipVerify: true
  valuesFrom:
    - targetPath: "secureJsonData.httpHeaderValue1"
      valueFrom:
        secretKeyRef:
          name: grafana-loki-gateway-token
          key: token
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: loki-application
  namespace: {{ include "audit-loki.lokiNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    {{- include "audit-loki.labels" . | nindent 4 }}
spec:
  instanceSelector:
    matchLabels:
      dashboards: "loki-audit"
  datasource:
    name: Loki-Application
    type: loki
    access: proxy
    url: https://logging-loki-gateway-http.{{ include "audit-loki.lokiNamespace" . }}.svc:8080/api/logs/v1/application
    jsonData:
      httpHeaderName1: Authorization
      maxLines: 1000
      timeout: 180
      tlsSkipVerify: true
  valuesFrom:
    - targetPath: "secureJsonData.httpHeaderValue1"
      valueFrom:
        secretKeyRef:
          name: grafana-loki-gateway-token
          key: token
---
# Prometheus datasource — token is injected from a Secret
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus
  namespace: {{ include "audit-loki.lokiNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    {{- include "audit-loki.labels" . | nindent 4 }}
spec:
  instanceSelector:
    matchLabels:
      dashboards: "loki-audit"
  valuesFrom:
    - targetPath: "secureJsonData.httpHeaderValue1"
      valueFrom:
        secretKeyRef:
          name: grafana-prometheus-token
          key: token
  datasource:
    name: Prometheus
    type: prometheus
    access: proxy
    url: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
    jsonData:
      httpHeaderName1: Authorization
      timeInterval: "30s"
      tlsSkipVerify: true
{{- end }}
