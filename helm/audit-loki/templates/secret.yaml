{{- if not .Values.azure.existingSecret }}
{{- $account := required "azure.accountName is required when azure.existingSecret is empty" .Values.azure.accountName }}
{{- $key := required "azure.accountKey is required when azure.existingSecret is empty" .Values.azure.accountKey }}
{{- $container := required "azure.container is required when azure.existingSecret is empty" .Values.azure.container }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "audit-loki.secretName" . }}
  namespace: {{ include "audit-loki.lokiNamespace" . }}
  labels:
    app.kubernetes.io/component: storage
    {{- include "audit-loki.labels" . | nindent 4 }}
type: Opaque
stringData:
  environment: {{ .Values.azure.environment | quote }}
  account_name: {{ $account | quote }}
  account_key: {{ $key | quote }}
  container: {{ $container | quote }}
{{- end }}
