{{- if .Values.operator.createNamespaces }}
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-operators-redhat
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    openshift.io/cluster-monitoring: "true"
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    {{- include "audit-loki.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "audit-loki.lokiNamespace" . }}
  annotations:
    openshift.io/node-selector: ""
    argocd.argoproj.io/sync-wave: "0"
  labels:
    openshift.io/cluster-monitoring: "true"
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    {{- include "audit-loki.labels" . | nindent 4 }}
{{- end }}
{{- if .Values.operator.createOperatorGroups }}
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: loki-operator
  namespace: openshift-operators-redhat
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "audit-loki.labels" . | nindent 4 }}
spec:
  upgradeStrategy: Default
---
# WARNING: Only enable createOperatorGroups on clusters with NO pre-existing
# logging operators. A second OperatorGroup in the same namespace breaks OLM.
# Check first: oc get operatorgroup -n openshift-logging
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: {{ include "audit-loki.lokiNamespace" . }}
  namespace: {{ include "audit-loki.lokiNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "audit-loki.labels" . | nindent 4 }}
spec:
  upgradeStrategy: Default
{{- end }}
