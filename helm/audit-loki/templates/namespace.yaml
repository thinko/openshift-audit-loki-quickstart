{{- if .Values.operator.createNamespaces }}
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-operators-redhat
  labels:
    openshift.io/cluster-monitoring: "true"
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    {{- include "audit-loki.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "audit-loki.lokiNamespace" . }}
  annotations:
    openshift.io/node-selector: ""
  labels:
    openshift.io/cluster-monitoring: "true"
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    {{- include "audit-loki.labels" . | nindent 4 }}
{{- end }}
{{- if .Values.operator.createOperatorGroups }}
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: loki-operator
  namespace: openshift-operators-redhat
  labels:
    {{- include "audit-loki.labels" . | nindent 4 }}
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: cluster-logging
  namespace: {{ include "audit-loki.lokiNamespace" . }}
  labels:
    {{- include "audit-loki.labels" . | nindent 4 }}
spec:
  upgradeStrategy: Default
{{- end }}
