{{- $sa := .Values.clusterLogForwarder.collectorServiceAccount }}
{{- $ns := include "audit-loki.clfNamespace" . }}
{{- if .Values.clusterLogForwarder.createRbac }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/component: collector
    {{- include "audit-loki.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-collect-audit-logs" (include "audit-loki.fullname" .) | trunc 63 | trimSuffix "-" }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    {{- include "audit-loki.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: collect-audit-logs
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-logs-writer" (include "audit-loki.fullname" .) | trunc 63 | trimSuffix "-" }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    {{- include "audit-loki.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: logging-collector-logs-writer
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $ns }}
{{- if .Values.infrastructure.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-collect-infra-logs" (include "audit-loki.fullname" .) | trunc 63 | trimSuffix "-" }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    {{- include "audit-loki.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: collect-infrastructure-logs
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $ns }}
{{- end }}
---
# Application log collection RBAC is always required — the app-logs input
# is always present (either routed to Loki or dropped to silence the
# ClusterLogForwarderRuntimeConfigurationMissingUnmatched alert).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-collect-app-logs" (include "audit-loki.fullname" .) | trunc 63 | trimSuffix "-" }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    {{- include "audit-loki.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: collect-application-logs
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $ns }}
---
{{- end }}
apiVersion: observability.openshift.io/v1
kind: ClusterLogForwarder
metadata:
  name: {{ .Values.clusterLogForwarder.name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app.kubernetes.io/component: collector
    {{- include "audit-loki.labels" . | nindent 4 }}
spec:
  managementState: Managed
  serviceAccount:
    name: {{ $sa }}
  inputs:
    - name: audit-logs
      type: audit
      audit:
        sources:
          {{- toYaml .Values.clusterLogForwarder.auditSources | nindent 10 }}
    {{- if .Values.infrastructure.enabled }}
    - name: infra-logs
      type: infrastructure
      infrastructure:
        sources:
          - container
          - node
    {{- end }}
    # Application input is always defined to prevent the
    # ClusterLogForwarderRuntimeConfigurationMissingUnmatched alert.
    # When application.enabled is false, a drop-all filter discards them.
    - name: app-logs
      type: application
      application: {}
  filters:
    - name: kube-api-audit-policy
      type: kubeAPIAudit
      kubeAPIAudit:
        omitStages:
          {{- toYaml .Values.clusterLogForwarder.kubeAPIAudit.omitStages | nindent 10 }}
        rules:
          # Drop system accounts first (always noise).
          - level: None
            users:
              {{- toYaml .Values.clusterLogForwarder.kubeAPIAudit.dropUsers | nindent 14 }}
          {{- if .Values.clusterLogForwarder.keepSecretReads }}
          # Keep: human users reading secrets (credential access detection).
          - level: Metadata
            verbs:
              - get
              - list
            resources:
              - group: ""
                resources:
                  - secrets
          {{- end }}
          # Drop all other read-only operations (high volume, low value).
          - level: None
            verbs:
              - get
              - list
              - watch
          - level: Metadata
    - name: drop-audit-noise
      type: drop
      drop:
        # Drop watch (always noise).
        - test:
            - field: .verb
              matches: '^watch$'
        # Drop get/list except secrets (human secret reads kept by policy).
        - test:
            - field: .verb
              matches: '^(get|list)$'
            {{- if .Values.clusterLogForwarder.keepSecretReads }}
            - field: .objectRef.resource
              notMatches: '^secrets$'
            {{- end }}
        - test:
            - field: .user.username
              matches: {{ .Values.clusterLogForwarder.drop.usernamePattern | quote }}
    {{- if and .Values.infrastructure.enabled (or .Values.infrastructure.dropProbeNoise .Values.infrastructure.dropDnsNoise) }}
    - name: drop-infra-noise
      type: drop
      drop:
        {{- if .Values.infrastructure.dropProbeNoise }}
        - test:
            - field: .message
              matches: '(healthz|readyz|livez).*200'
        - test:
            - field: .message
              matches: 'Syncing proxy rules'
        {{- end }}
        {{- if .Values.infrastructure.dropDnsNoise }}
        - test:
            - field: .kubernetes.container_name
              matches: '^dns$'
            - field: .message
              matches: '^\d+\.\d+\.\d+\.\d+.*NOERROR'
        {{- end }}
        - test:
            - field: .kubernetes.container_name
              matches: '^kube-rbac-proxy'
            - field: .message
              matches: 'TLS handshake error'
        - test:
            - field: .message
              matches: 'successfully (renewed|acquired) lease'
        - test:
            - field: .message
              matches: '(tokenreview|authenticate).*success'
            - field: .kubernetes.container_name
              matches: '^kube-rbac-proxy'
    {{- end }}
    {{- if not .Values.application.enabled }}
    # Catch-all drop for application logs — prevents storage in Loki
    # while satisfying the operator's requirement that every log type
    # has a matching pipeline.
    - name: drop-all-app
      type: drop
      drop:
        - test:
            - field: .message
              matches: '.'
    {{- end }}
  outputs:
    - name: local-loki
      type: lokiStack
      lokiStack:
        dataModel: {{ .Values.clusterLogForwarder.dataModel }}
        target:
          name: {{ .Values.lokiStack.name }}
          namespace: {{ include "audit-loki.lokiNamespace" . }}
        authentication:
          token:
            from: serviceAccount
      tls:
        ca:
          key: {{ .Values.clusterLogForwarder.tls.ca.key | quote }}
          configMapName: {{ .Values.clusterLogForwarder.tls.ca.configMapName | quote }}
  pipelines:
    - name: audit-to-loki
      inputRefs:
        - audit-logs
      filterRefs:
        - kube-api-audit-policy
        - drop-audit-noise
      outputRefs:
        - local-loki
    {{- if .Values.infrastructure.enabled }}
    - name: infra-to-loki
      inputRefs:
        - infra-logs
      {{- if or .Values.infrastructure.dropProbeNoise .Values.infrastructure.dropDnsNoise }}
      filterRefs:
        - drop-infra-noise
      {{- end }}
      outputRefs:
        - local-loki
    {{- end }}
    {{- if .Values.application.enabled }}
    - name: app-to-loki
      inputRefs:
        - app-logs
      outputRefs:
        - local-loki
    {{- else }}
    # Application logs collected and dropped — nothing reaches Loki.
    # This pipeline exists solely to silence the MissingUnmatched alert.
    - name: app-drop
      inputRefs:
        - app-logs
      filterRefs:
        - drop-all-app
      outputRefs:
        - local-loki
    {{- end }}
