#@data/values
---
#! Cluster-specific overlay for REPLACE_ME_CLUSTER.
#! This file overwrites the generic values.yaml when synced to the internal repo.
#!
#! Sizing reference:
#!   1x.extra-small: requests cpu=30,  memory=64Gi   limits.memory=128Gi
#!   1x.small:       requests cpu=72,  memory=176Gi  limits.memory=256Gi
#!   1x.medium:      requests cpu=100, memory=256Gi  limits.memory=384Gi
#!
#! limits.memory MUST be set — the platform quota template defaults to 20Gi
#! when absent, which blocks pod scheduling. Set ~1.5-2× requests.memory.

#! ── Node placement ─────────────────────────────────────────────────
#! Uncomment to schedule Loki and Grafana pods on infra nodes.
#! Leave empty to run on any worker (default).
#! node_placement:
#!   node_selector:
#!     node-role.kubernetes.io/infra: ""
#!   tolerations:
#!     - key: node-role.kubernetes.io/infra
#!       effect: NoSchedule
#! ── Vault-sourced secrets ────────────────────────────────────────────
#! All secrets for the Loki deployment, from a single Vault path.
#! Injected at render time from Vault (never committed to git).
#!
#! Vault path: secret/<team>/openshift/<cluster>/loki-storage
#!
#! Azure storage (for the blob storage account holding Loki data):
#!   Standard auth: account_name + account_key (storage access key)
#!   SP auth:       account_name + client_id + client_secret + tenant_id
#!                  (SP with Storage Blob Data Contributor on the account)
#!   NOT cluster-level or group-sync credentials.
#!
#! Grafana: when set, renders the admin credentials Secret from Vault.
#!   When empty, the PostSync hook generates a random password instead.
#! Platform-injected credentials (from Conjur). Do not remove any section.
#! See gitops/namespaces/openshift-logging/values.yaml for full explanation.
secrets:
  azure:
    client_id: ""
    client_secret: ""
    spn: ""
    log_analytics:
      workspace_shared_key: ""
  redhat:
    pull_secret: ""
  dynatrace:
    apiToken: ""
    wiz:
      clientId: ""
      clientToken: ""
  cloudability:
    apikey: ""
  ldap:
    username: ""
    password: ""
  prisma:
    image_download_key: ""
    install_bundle_base64: ""
    certs_base64: ""
  ssh:
    key:
      gitops: ""
  nexus:
    registry:
      username: ""
      password: ""
  ssl:
    key:
      api: ""
      ingress: ""
  kubeconfig: ""
  loki_storage:
    #! ── Azure blob storage ──
    account_name: ""
    account_key: ""               #! real Azure key, or empty (renders a double-base64 dummy). A single-encoded placeholder is rejected.
    container: "loki-audit"
    environment: "AzureGlobal"
    client_id: ""                 #! SP app registration client ID (SP auth)
    client_secret: ""             #! SP credential (SP auth)
    tenant_id: ""                 #! Azure AD tenant for the SP (SP auth)
    #! ── Grafana ──
    grafana_admin_password: ""    #! leave empty to auto-generate via PostSync hook
    grafana_image: ""             #! container image (empty → grafana/grafana:latest)
    #! ── LokiStack sizing and operator ──
    lokistack_size: "1x.small"    #! 1x.extra-small | 1x.small | 1x.medium
    management_state: "Managed"   #! Managed (default) | Unmanaged (required for SP auth)
    storage_class: "managed-csi"  #! storageClassName for LokiStack PVCs
    #! ── ResourceQuota sizing ──
    requests_cpu: ""              #! e.g. "72"  — empty means use envs[0].spec_hard default
    requests_memory: ""           #! e.g. "176Gi"
    limits_memory: ""             #! e.g. "256Gi" — platform quota template requires this
    #! ── RBAC / environment identity ──
    rbac_edit: ""                 #! comma-separated AD groups for edit role
    rbac_view: ""                 #! comma-separated AD groups for view role
    deployment_id: ""             #! environment deployment identifier

node_placement:
  node_selector: {}
  tolerations: []

project:
  name: openshift-logging
  labels:
    kubernetes.io/metadata.name: openshift-logging
    argocd.argoproj.io/managed-by: "openshift-gitops"
    dt-monitoring: "true"
    openshift.io/cluster-monitoring: "true"
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    openshift.io/node-selector: ""
    openshift.io/description: "OpenShift Logging LokiStack (audit + infrastructure)"
    openshift.io/display-name: openshift-logging
    argocd.argoproj.io/sync-wave: "1"
envs:
  - name: REPLACE_ME_CLUSTER
    rbac:
      edit: REPLACE_ME_AD_GROUP_EDIT
      view: REPLACE_ME_AD_GROUP_VIEW
    deployment_id: REPLACE_ME_DEPLOYMENT_ID
    spec_hard:
      requests:
        cpu: 72
        memory: 176Gi
      limits:
        memory: 256Gi
      count:
        persistentvolumeclaims: 20
