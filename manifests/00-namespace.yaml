---
# Namespaces for the Loki Operator (cluster-wide) and the logging stack.
# Labels enable cluster monitoring to scrape operator and collector metrics.
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-operators-redhat
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    openshift.io/cluster-monitoring: "true"
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-logging
  annotations:
    openshift.io/node-selector: ""
    argocd.argoproj.io/sync-wave: "0"
  labels:
    openshift.io/cluster-monitoring: "true"
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
# Cluster-scoped OperatorGroup so LokiStack can be created in any namespace
# (the CR itself still lives in openshift-logging).
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: loki-operator
  namespace: openshift-operators-redhat
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  upgradeStrategy: Default
# NOTE: The openshift-logging OperatorGroup is NOT in this manifest.
# deploy.sh creates one only if the namespace does not already have one.
# Blindly applying a second OperatorGroup breaks OLM (forces Manual
# InstallPlan approval and causes CSV install loops).
