---
# Collector identity. Bind cluster roles *before* creating the
# ClusterLogForwarder. Adding an audit input without collect-audit-logs
# causes the operator to tear down the entire collector DaemonSet.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logging-collector
  namespace: openshift-logging
  labels:
    app.kubernetes.io/name: clusterlogforwarder
    app.kubernetes.io/component: collector
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: logging-collector-audit-logs
  labels:
    app.kubernetes.io/name: clusterlogforwarder
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: collect-audit-logs
subjects:
  - kind: ServiceAccount
    name: logging-collector
    namespace: openshift-logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: logging-collector-logs-writer
  labels:
    app.kubernetes.io/name: clusterlogforwarder
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: logging-collector-logs-writer
subjects:
  - kind: ServiceAccount
    name: logging-collector
    namespace: openshift-logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: logging-collector-infrastructure-logs
  labels:
    app.kubernetes.io/name: clusterlogforwarder
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: collect-infrastructure-logs
subjects:
  - kind: ServiceAccount
    name: logging-collector
    namespace: openshift-logging
---
# Application logs are collected and immediately dropped (not stored in Loki).
# This RBAC + drop pipeline silences the
# ClusterLogForwarderRuntimeConfigurationMissingUnmatched alert
# that fires when a log type exists on the cluster with no matching pipeline.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: logging-collector-application-logs
  labels:
    app.kubernetes.io/name: clusterlogforwarder
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: collect-application-logs
subjects:
  - kind: ServiceAccount
    name: logging-collector
    namespace: openshift-logging
---
# OpenShift Logging 6.x (OpenShift 4.14+ / 4.20): observability.openshift.io/v1.
# The older logging.openshift.io/v1 ClusterLogForwarder API is removed in 6.x.
#
# Pipeline: kube/openshift/ovn audit -> edge filters -> in-cluster LokiStack.
# Filters keep mutating API traffic (create/update/patch/delete) with user
# attribution and drop routine reads plus platform service-account noise.
apiVersion: observability.openshift.io/v1
kind: ClusterLogForwarder
metadata:
  name: loki-audit
  namespace: openshift-logging
  labels:
    app.kubernetes.io/name: clusterlogforwarder
    app.kubernetes.io/part-of: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  managementState: Managed
  serviceAccount:
    name: logging-collector
  inputs:
    - name: audit-logs
      type: audit
      audit:
        sources:
          - kubeAPI
          - openshiftAPI
          - ovn
    - name: infra-logs
      type: infrastructure
      infrastructure:
        sources:
          - container
          - node
    # Application logs are acknowledged but dropped to silence the
    # ClusterLogForwarderRuntimeConfigurationMissingUnmatched alert.
    - name: app-logs
      type: application
      application: {}
  filters:
    # kubeAPIAudit understands kube-apiserver JSON natively (wildcards, verbs).
    # Metadata (not RequestResponse) keeps user/verb/objectRef without bodies
    # that can contain Secrets or other sensitive payloads.
    - name: kube-api-audit-policy
      type: kubeAPIAudit
      kubeAPIAudit:
        omitStages:
          - RequestReceived
        rules:
          # Drop: system accounts first (they're always noise).
          - level: None
            users:
              - "system:node*"
              - "system:serviceaccount:kube-system:*"
              - "system:serviceaccount:openshift-*"
          # Keep: human users reading secrets (credential access detection).
          # This rule MUST precede the blanket get/list/watch drop so
          # secret reads by real users (IAM, admin, developer) are retained.
          - level: Metadata
            verbs:
              - get
              - list
            resources:
              - group: ""
                resources:
                  - secrets
          # Drop: all other read-only operations (high volume, low value).
          - level: None
            verbs:
              - get
              - list
              - watch
          # Keep: everything else at Metadata level (mutations, etc.)
          - level: Metadata
    # Vector drop filter as a second gate. Tests in one drop[] entry are OR'd;
    # conditions inside a single test[] are AND'd. Missing fields evaluate false.
    - name: drop-audit-noise
      type: drop
      drop:
        # Drop watch (always noise).
        - test:
            - field: .verb
              matches: '^watch$'
        # Drop get/list EXCEPT secrets (human secret reads are kept by policy).
        - test:
            - field: .verb
              matches: '^(get|list)$'
            - field: .objectRef.resource
              notMatches: '^secrets$'
        - test:
            - field: .user.username
              matches: '^system:(node|serviceaccount:kube-system|serviceaccount:openshift-.*)'
    # Drop high-volume, low-value infrastructure log noise.
    # Health probes, kube-proxy sync, and successful CoreDNS lookups
    # generate massive volume with minimal diagnostic value.
    - name: drop-infra-noise
      type: drop
      drop:
        - test:
            - field: .message
              matches: '(healthz|readyz|livez).*200'
        - test:
            - field: .message
              matches: 'Syncing proxy rules'
        - test:
            - field: .kubernetes.container_name
              matches: '^dns$'
            - field: .message
              matches: '^\d+\.\d+\.\d+\.\d+.*NOERROR'
        # kube-rbac-proxy TLS noise — handshake resets and EOF errors
        - test:
            - field: .kubernetes.container_name
              matches: '^kube-rbac-proxy'
            - field: .message
              matches: 'TLS handshake error'
        # Routine leader election renewals (every few seconds per operator)
        - test:
            - field: .message
              matches: 'successfully (renewed|acquired) lease'
        # Token review and authentication cache hits (extremely high volume)
        - test:
            - field: .message
              matches: '(tokenreview|authenticate).*success'
            - field: .kubernetes.container_name
              matches: '^kube-rbac-proxy'
    # Catch-all drop for application logs — prevents storage in Loki
    # while satisfying the operator's requirement that every log type
    # has a matching pipeline.
    - name: drop-all-app
      type: drop
      drop:
        - test:
            - field: .message
              matches: '.'
  outputs:
    - name: local-loki
      type: lokiStack
      lokiStack:
        dataModel: Viaq
        target:
          name: logging-loki
          namespace: openshift-logging
        authentication:
          token:
            from: serviceAccount
      tls:
        ca:
          key: service-ca.crt
          configMapName: openshift-service-ca.crt
  pipelines:
    - name: audit-to-loki
      inputRefs:
        - audit-logs
      filterRefs:
        - kube-api-audit-policy
        - drop-audit-noise
      outputRefs:
        - local-loki
    - name: infra-to-loki
      inputRefs:
        - infra-logs
      filterRefs:
        - drop-infra-noise
      outputRefs:
        - local-loki
    # Application logs are collected and dropped — nothing reaches Loki.
    # This pipeline exists solely to silence the MissingUnmatched alert.
    - name: app-drop
      inputRefs:
        - app-logs
      filterRefs:
        - drop-all-app
      outputRefs:
        - local-loki
