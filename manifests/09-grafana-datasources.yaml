---
# RBAC: ServiceAccount for Grafana to query the LokiStack gateway.
# OpenShift-logging tenant mode authorizes via SAR on
# loki.grafana.com/{audit,infrastructure,application} resourceName=logs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-loki
  namespace: openshift-logging
  labels:
    app.kubernetes.io/name: loki-grafana
    app.kubernetes.io/part-of: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grafana-loki-tenant-view
  labels:
    app.kubernetes.io/name: loki-grafana
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups:
      - loki.grafana.com
    resources:
      - application
      - audit
      - infrastructure
    resourceNames:
      - logs
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-loki-tenant-view
  labels:
    app.kubernetes.io/name: loki-grafana
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grafana-loki-tenant-view
subjects:
  - kind: ServiceAccount
    name: grafana-loki
    namespace: openshift-logging
---
# RBAC: ServiceAccount for Prometheus / Thanos Querier access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-prometheus
  namespace: openshift-logging
  labels:
    app.kubernetes.io/name: loki-grafana
    app.kubernetes.io/part-of: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-prometheus-monitoring-view
  labels:
    app.kubernetes.io/name: loki-grafana
    app.kubernetes.io/part-of: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: grafana-prometheus
    namespace: openshift-logging
---
# Grafana datasource provisioning via ConfigMap.
# Mounted into /etc/grafana/provisioning/datasources/ by the Deployment.
#
# Token placeholders ($LOKI_BEARER_TOKEN, $PROMETHEUS_BEARER_TOKEN) are
# replaced by scripts/deploy-grafana.sh at deploy time using sed + oc create.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-provisioning
  namespace: openshift-logging
  labels:
    app.kubernetes.io/name: loki-grafana
    app.kubernetes.io/part-of: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "3"
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki (Audit)
        type: loki
        access: proxy
        url: https://logging-loki-gateway-http.openshift-logging.svc:8080/api/logs/v1/audit
        isDefault: true
        jsonData:
          httpHeaderName1: Authorization
          maxLines: 500
          timeout: 60
          tlsSkipVerify: true
        secureJsonData:
          httpHeaderValue1: "$LOKI_BEARER_TOKEN"

      - name: Loki (Infrastructure)
        type: loki
        access: proxy
        url: https://logging-loki-gateway-http.openshift-logging.svc:8080/api/logs/v1/infrastructure
        jsonData:
          httpHeaderName1: Authorization
          maxLines: 500
          timeout: 60
          tlsSkipVerify: true
        secureJsonData:
          httpHeaderValue1: "$LOKI_BEARER_TOKEN"

      # Loki (Application) datasource intentionally excluded — out of customer scope.

      - name: Prometheus
        type: prometheus
        access: proxy
        url: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
        jsonData:
          httpHeaderName1: Authorization
          timeInterval: "30s"
          tlsSkipVerify: true
        secureJsonData:
          httpHeaderValue1: "$PROMETHEUS_BEARER_TOKEN"
---
# Dashboard provider — tells Grafana to look for JSON files in the dashboards mount.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: openshift-logging
  labels:
    app.kubernetes.io/name: loki-grafana
    app.kubernetes.io/part-of: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "3"
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        options:
          path: /opt/grafana/dashboards
          foldersFromFilesStructure: false
