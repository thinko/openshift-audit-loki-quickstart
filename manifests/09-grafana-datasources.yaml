---
# ServiceAccount used by Grafana to query the LokiStack gateway.
# OpenShift-logging tenant mode requires a bearer token plus a tenant
# prefix in the URL (/api/logs/v1/{audit|infrastructure|application}).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-loki
  namespace: openshift-logging
  labels:
    app.kubernetes.io/name: loki-grafana
    app.kubernetes.io/part-of: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-loki-audit-view
  labels:
    app.kubernetes.io/name: loki-grafana
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-logging-audit-view
subjects:
  - kind: ServiceAccount
    name: grafana-loki
    namespace: openshift-logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-loki-infrastructure-view
  labels:
    app.kubernetes.io/name: loki-grafana
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-logging-infrastructure-view
subjects:
  - kind: ServiceAccount
    name: grafana-loki
    namespace: openshift-logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-loki-application-view
  labels:
    app.kubernetes.io/name: loki-grafana
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-logging-application-view
subjects:
  - kind: ServiceAccount
    name: grafana-loki
    namespace: openshift-logging
---
# Loki datasource — audit tenant (default). Gateway path encodes the tenant.
# Token secret grafana-loki-gateway-token is created by scripts/deploy-grafana.sh
# (value MUST include the "Bearer " prefix).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: loki
  namespace: openshift-logging
  labels:
    app.kubernetes.io/name: loki-grafana
    app.kubernetes.io/part-of: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "loki-audit"
  datasource:
    name: Loki
    type: loki
    access: proxy
    url: https://logging-loki-gateway-http.openshift-logging.svc:8080/api/logs/v1/audit
    isDefault: true
    jsonData:
      httpHeaderName1: Authorization
      maxLines: 5000
      timeout: 60
      tlsSkipVerify: true
  valuesFrom:
    - targetPath: "secureJsonData.httpHeaderValue1"
      valueFrom:
        secretKeyRef:
          name: grafana-loki-gateway-token
          key: token
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: loki-infrastructure
  namespace: openshift-logging
  labels:
    app.kubernetes.io/name: loki-grafana
    app.kubernetes.io/part-of: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "loki-audit"
  datasource:
    name: Loki-Infrastructure
    type: loki
    access: proxy
    url: https://logging-loki-gateway-http.openshift-logging.svc:8080/api/logs/v1/infrastructure
    jsonData:
      httpHeaderName1: Authorization
      maxLines: 5000
      timeout: 60
      tlsSkipVerify: true
  valuesFrom:
    - targetPath: "secureJsonData.httpHeaderValue1"
      valueFrom:
        secretKeyRef:
          name: grafana-loki-gateway-token
          key: token
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: loki-application
  namespace: openshift-logging
  labels:
    app.kubernetes.io/name: loki-grafana
    app.kubernetes.io/part-of: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "loki-audit"
  datasource:
    name: Loki-Application
    type: loki
    access: proxy
    url: https://logging-loki-gateway-http.openshift-logging.svc:8080/api/logs/v1/application
    jsonData:
      httpHeaderName1: Authorization
      maxLines: 5000
      timeout: 60
      tlsSkipVerify: true
  valuesFrom:
    - targetPath: "secureJsonData.httpHeaderValue1"
      valueFrom:
        secretKeyRef:
          name: grafana-loki-gateway-token
          key: token
---
# Prometheus datasource for PromQL metrics.
# Points to the in-cluster Thanos Querier. Uses a ServiceAccount token
# for authentication against the OpenShift monitoring stack.
#
# Before applying, create the token secret:
#   oc create token grafana-prometheus -n openshift-logging --duration=8760h \
#     | xargs -I{} oc create secret generic grafana-prometheus-token \
#       -n openshift-logging --from-literal=token="Bearer {}"
#
# The secret value MUST include the "Bearer " prefix because the Grafana
# Operator injects it verbatim into the Authorization header.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-prometheus
  namespace: openshift-logging
  labels:
    app.kubernetes.io/name: loki-grafana
    app.kubernetes.io/part-of: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-prometheus-monitoring-view
  labels:
    app.kubernetes.io/name: loki-grafana
    app.kubernetes.io/part-of: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: grafana-prometheus
    namespace: openshift-logging
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus
  namespace: openshift-logging
  labels:
    app.kubernetes.io/name: loki-grafana
    app.kubernetes.io/part-of: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "loki-audit"
  datasource:
    name: Prometheus
    type: prometheus
    access: proxy
    url: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
    jsonData:
      httpHeaderName1: Authorization
      timeInterval: "30s"
      tlsSkipVerify: true
  valuesFrom:
    - targetPath: "secureJsonData.httpHeaderValue1"
      valueFrom:
        secretKeyRef:
          name: grafana-prometheus-token
          key: token
