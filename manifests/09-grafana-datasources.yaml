---
# Loki datasource for log queries (LogQL).
# The gateway service handles multi-tenant routing via X-Scope-OrgID header.
# Tenants: audit, infrastructure, application.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: loki
  namespace: openshift-logging
  labels:
    app.kubernetes.io/name: loki-grafana
    app.kubernetes.io/part-of: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "loki-audit"
  datasource:
    name: Loki
    type: loki
    access: proxy
    url: http://logging-loki-gateway-http.openshift-logging.svc:8080
    isDefault: true
    jsonData:
      httpHeaderName1: X-Scope-OrgID
      maxLines: 5000
      timeout: 60
    secureJsonData:
      httpHeaderValue1: "audit|infrastructure|application"
---
# Prometheus datasource for PromQL metrics.
# Points to the in-cluster Thanos Querier. Uses a ServiceAccount token
# for authentication against the OpenShift monitoring stack.
#
# Before applying, create the token secret:
#   oc create token grafana-prometheus -n openshift-logging --duration=8760h \
#     | xargs -I{} oc create secret generic grafana-prometheus-token \
#       -n openshift-logging --from-literal=token="Bearer {}"
#
# The secret value MUST include the "Bearer " prefix because the Grafana
# Operator injects it verbatim into the Authorization header.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-prometheus
  namespace: openshift-logging
  labels:
    app.kubernetes.io/name: loki-grafana
    app.kubernetes.io/part-of: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-prometheus-monitoring-view
  labels:
    app.kubernetes.io/name: loki-grafana
    app.kubernetes.io/part-of: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: grafana-prometheus
    namespace: openshift-logging
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus
  namespace: openshift-logging
  labels:
    app.kubernetes.io/name: loki-grafana
    app.kubernetes.io/part-of: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "loki-audit"
  datasource:
    name: Prometheus
    type: prometheus
    access: proxy
    url: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
    jsonData:
      httpHeaderName1: Authorization
      timeInterval: "30s"
      tlsSkipVerify: true
  valuesFrom:
    - targetPath: "datasource.secureJsonData.httpHeaderValue1"
      valueFrom:
        secretKeyRef:
          name: grafana-prometheus-token
          key: token
