---
# GrafanaDashboard CRs are generated by scripts/deploy-grafana.sh from the
# JSON files in dashboards/. This file is a reference for GitOps/Helm use.
#
# The Grafana Operator's GrafanaDashboard CRD supports three methods:
#   1. spec.json — inline JSON string (used by the deploy script)
#   2. spec.url — fetch from HTTP URL
#   3. spec.configMapRef — reference a ConfigMap with the JSON
#
# For ArgoCD deployments, use the Helm template (templates/grafana-dashboards.yaml)
# which reads from configMapRef or inline json.
#
# Manual apply:
#   scripts/deploy-grafana.sh handles this automatically.
