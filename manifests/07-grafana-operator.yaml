---
# OPTIONAL: Grafana Operator via OLM.
#
# This manifest is NOT required for the default standalone Grafana deployment.
# Only apply it if your cluster allows pulls from ghcr.io (community-operators)
# and you want to use the operator's GrafanaDashboard / GrafanaDatasource CRDs.
#
# Most managed clusters (ARO, ROSA, etc.) block ghcr.io via image signature
# policies. Use the standalone deployment (08-grafana-instance.yaml) instead.
#
# If the operator IS available, deploy-grafana.sh can be adapted to use CRDs
# instead of ConfigMap-based provisioning.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: grafana-operator
  namespace: openshift-operators
  labels:
    app.kubernetes.io/name: grafana-operator
    app.kubernetes.io/part-of: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  channel: v5
  installPlanApproval: Automatic
  name: grafana-operator
  source: community-operators
  sourceNamespace: openshift-marketplace
