---
# Grafana instance for audit log dashboards.
# Single replica, conservative resources. Scale via Helm values for larger environments.
#
# Admin credentials are auto-generated by the Grafana Operator in a Secret
# named loki-grafana-admin-credentials. Retrieve with:
#   oc get secret loki-grafana-admin-credentials -n openshift-logging \
#     -o jsonpath='{.data.GF_SECURITY_ADMIN_PASSWORD}' | base64 -d
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: loki-grafana
  namespace: openshift-logging
  labels:
    app.kubernetes.io/name: loki-grafana
    app.kubernetes.io/part-of: openshift-logging
    dashboards: "loki-audit"
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  deployment:
    spec:
      replicas: 1
      template:
        spec:
          containers:
            - name: grafana
              resources:
                requests:
                  memory: 128Mi
                  cpu: 100m
                limits:
                  memory: 512Mi
                  cpu: 500m
  route:
    spec:
      tls:
        termination: edge
  config:
    log:
      mode: console
      level: warn
    auth.anonymous:
      enabled: "true"
      org_role: Viewer
