---
# Standalone Grafana deployment — no operator required.
# Uses a Nexus-proxied or private-registry Grafana image to comply with
# cluster image signature policies that block ghcr.io / docker.io pulls.
#
# Image: Set GRAFANA_IMAGE before applying, or edit the default below.
#   Examples:
#     <nexus-host>/docker-hub/grafana/grafana:latest
#     <nexus-host>/docker-private/openshift-samples/grafana:11.3.0
#
# Admin credentials:
#   Default user: admin / admin (change on first login)
#   Or set via the grafana-admin-credentials Secret below.
#
# Datasource provisioning is handled by ConfigMaps in 09-grafana-datasources.yaml.
# Dashboard provisioning is handled by scripts/deploy-grafana.sh.
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: openshift-logging
  labels:
    app.kubernetes.io/name: loki-grafana
    app.kubernetes.io/part-of: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "3"
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: admin
  GF_SECURITY_ADMIN_PASSWORD: lokiAudit2026!
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: openshift-logging
  labels:
    app.kubernetes.io/name: loki-grafana
    app.kubernetes.io/part-of: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "3"
data:
  grafana.ini: |
    [server]
    root_url = %(protocol)s://%(domain)s/

    [log]
    mode = console
    level = warn

    [auth]
    disable_login_form = false

    [auth.anonymous]
    enabled = true
    org_role = Viewer

    [dashboards]
    default_home_dashboard_path = /opt/grafana/dashboards/grafana-ops-overview.json

    [security]
    allow_embedding = true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-grafana
  namespace: openshift-logging
  labels:
    app.kubernetes.io/name: loki-grafana
    app.kubernetes.io/part-of: openshift-logging
    app: loki-grafana
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki-grafana
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: loki-grafana
        app.kubernetes.io/name: loki-grafana
    spec:
      serviceAccountName: grafana-loki
      containers:
        - name: grafana
          # CHANGE THIS to your Nexus-proxied image path:
          image: grafana/grafana:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          envFrom:
            - secretRef:
                name: grafana-admin-credentials
          env:
            - name: GF_PATHS_CONFIG
              value: /etc/grafana/grafana.ini
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
            - name: GF_PATHS_DATA
              value: /var/lib/grafana
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: grafana-config
              mountPath: /etc/grafana/grafana.ini
              subPath: grafana.ini
            - name: datasource-provisioning
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /opt/grafana/dashboards
      volumes:
        - name: grafana-config
          configMap:
            name: grafana-config
        - name: datasource-provisioning
          configMap:
            name: grafana-datasource-provisioning
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: loki-grafana
  namespace: openshift-logging
  labels:
    app.kubernetes.io/name: loki-grafana
    app.kubernetes.io/part-of: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: loki-grafana
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: loki-grafana
  namespace: openshift-logging
  labels:
    app.kubernetes.io/name: loki-grafana
    app.kubernetes.io/part-of: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: loki-grafana
    weight: 100
  port:
    targetPort: http
