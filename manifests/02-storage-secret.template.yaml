---
# Template only. Do not commit a filled copy.
#
# GitOps / ARO: Entra service principal (app or user-assigned MI) with
# federated credentials. Loki Operator does not accept client_secret.
# LokiStack spec.storage.secret.credentialMode must be token.
#
#   oc create secret generic logging-loki-azure \
#     --namespace openshift-logging \
#     --from-literal=environment=AzureGlobal \
#     --from-literal=account_name="${AZURE_STORAGE_ACCOUNT_NAME}" \
#     --from-literal=container="${AZURE_CONTAINER_NAME}" \
#     --from-literal=client_id="${AZURE_CLIENT_ID}" \
#     --from-literal=tenant_id="${AZURE_TENANT_ID}" \
#     --from-literal=subscription_id="${AZURE_SUBSCRIPTION_ID}" \
#     --from-literal=audience=api://AzureADTokenExchange
#
# Sandbox only (make deploy / account key). Requires credentialMode: static
# on the LokiStack (manifests/03-lokistack.yaml):
#
#   oc create secret generic logging-loki-azure \
#     --namespace openshift-logging \
#     --from-literal=environment=AzureGlobal \
#     --from-literal=account_name="${AZURE_STORAGE_ACCOUNT_NAME}" \
#     --from-literal=account_key="${AZURE_STORAGE_ACCOUNT_KEY}" \
#     --from-literal=container="${AZURE_CONTAINER_NAME}"
#
# Supported environment values: AzureGlobal, AzureChinaCloud,
# AzureGermanCloud, AzureUSGovernment.
#
# Do not copy azure-cloud-credentials (cluster identity).
apiVersion: v1
kind: Secret
metadata:
  name: logging-loki-azure
  namespace: openshift-logging
  labels:
    app.kubernetes.io/name: lokistack
    app.kubernetes.io/component: storage
type: Opaque
stringData:
  environment: AzureGlobal
  account_name: "<AZURE_STORAGE_ACCOUNT_NAME>"
  container: "<CONTAINER_NAME>"
  client_id: "<AZURE_CLIENT_ID>"
  tenant_id: "<AZURE_TENANT_ID>"
  subscription_id: "<AZURE_SUBSCRIPTION_ID>"
  audience: api://AzureADTokenExchange
  # Sandbox static mode only (omit the Entra keys above if you use this):
  # account_key: "<AZURE_STORAGE_ACCOUNT_KEY>"
