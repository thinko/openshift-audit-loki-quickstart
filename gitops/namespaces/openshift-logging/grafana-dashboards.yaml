  grafana-loki-profiler.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "title": "LokiStack Query Profiler",
      "uid": "loki-query-profiler",
      "description": "Loki querier and query-frontend performance metrics. Use this to identify slow queries and resource bottlenecks.",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "30s",
      "panels": [
        {
          "type": "row",
          "title": "Query Performance",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "title": "Query Latency (p99)",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le, route) (rate(loki_request_duration_seconds_bucket{namespace=\"openshift-logging\"}[5m])))",
              "legendFormat": "p99 {{route}}",
              "refId": "A"
            },
            {
              "expr": "topk(5, max by (route) (loki_request_duration_seconds{namespace=\"openshift-logging\", quantile=\"0.99\"}))",
              "legendFormat": "p99 {{route}}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 20
              }
            },
            "overrides": []
          }
        },
        {
          "title": "Query Rate by Route",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "expr": "sum by (route) (rate(loki_request_duration_seconds_count{namespace=\"openshift-logging\"}[5m]))",
              "legendFormat": "{{route}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 20,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "title": "Query Errors by Route",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 9
          },
          "targets": [
            {
              "expr": "sum by (route, status_code) (rate(loki_request_duration_seconds_count{namespace=\"openshift-logging\", status_code!~\"2..\"}[5m]))",
              "legendFormat": "{{status_code}} {{route}}",
              "refId": "A"
            },
            {
              "expr": "sum by (status_code) (rate(loki_request_duration_seconds_count{namespace=\"openshift-logging\", status_code=~\"(429|503|500)\"}[5m]))",
              "legendFormat": "total {{status_code}}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 30
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          }
        },
        {
          "title": "Active Queries (Inflight)",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 9
          },
          "targets": [
            {
              "expr": "sum(loki_inflight_requests{namespace=\"openshift-logging\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 5
                  },
                  {
                    "color": "red",
                    "value": 15
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "title": "Querier Queue Length",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 9
          },
          "targets": [
            {
              "expr": "sum(loki_query_frontend_queue_length{namespace=\"openshift-logging\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 10
                  },
                  {
                    "color": "red",
                    "value": 50
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "Querier Resources",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 17
          }
        },
        {
          "title": "Querier Memory Usage",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 18
          },
          "targets": [
            {
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"openshift-logging\", pod=~\"logging-loki-querier-.*\", container!=\"POD\", container!=\"\"})",
              "legendFormat": "{{pod}}",
              "refId": "A"
            },
            {
              "expr": "max(kube_pod_container_resource_limits{namespace=\"openshift-logging\", pod=~\"logging-loki-querier-.*\", resource=\"memory\", container!=\"\"})",
              "legendFormat": "limit",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 20
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "limit"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "red",
                      "mode": "fixed"
                    }
                  }
                ]
              }
            ]
          }
        },
        {
          "title": "Querier CPU Usage",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 18
          },
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"openshift-logging\", pod=~\"logging-loki-querier-.*\", container!=\"POD\", container!=\"\"}[5m]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 20
              }
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "Ingestion Pipeline",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 26
          }
        },
        {
          "title": "Chunk Bytes Stored",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 27
          },
          "targets": [
            {
              "expr": "sum by (tenant) (rate(loki_ingester_chunk_stored_bytes_total{namespace=\"openshift-logging\"}[5m]))",
              "legendFormat": "{{tenant}}",
              "refId": "A"
            },
            {
              "expr": "sum by (tenant) (rate(loki_ingester_bytes_received_total{namespace=\"openshift-logging\"}[5m]))",
              "legendFormat": "{{tenant}} (received)",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 30,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "title": "Lines Ingested/s by Tenant",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 27
          },
          "targets": [
            {
              "expr": "sum by (tenant) (rate(loki_distributor_lines_received_total{namespace=\"openshift-logging\"}[5m]))",
              "legendFormat": "{{tenant}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 30,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          }
        }
      ],
      "schemaVersion": 39,
      "version": 1
    }
