#@ load("@ytt:data", "data")
#@ load("@ytt:base64", "base64")

#! Loki object-storage Secret — rendered from Vault-sourced values.
#!
#! This template creates the logging-loki-azure Secret that the LokiStack
#! operator requires. Secret values are injected via data.values.secrets.azure
#! at render time (typically populated from Vault by the platform pipeline).
#!
#! When secrets.azure.account_name is empty, this template produces no output
#! and the Secret must be created out-of-band (see scripts/init-sp-auth.sh
#! or the deploy checklist for manual creation commands).
#!
#! Vault path convention:
#!   secret/<team>/openshift/<cluster>/azure
#!
#! Auth modes:
#!   Standard (account_key): account_name + account_key + container + environment
#!   SP auth  (client_id):   account_name + container + environment +
#!                            client_id + client_secret + tenant_id

#@ azure = data.values.secrets.azure
#@ if azure.account_name != "":
---
apiVersion: v1
kind: Secret
metadata:
  name: logging-loki-azure
  namespace: openshift-logging
  labels:
    app.kubernetes.io/name: lokistack
    app.kubernetes.io/part-of: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "2"
type: Opaque
data:
  account_name: #@ base64.encode(azure.account_name)
  container: #@ base64.encode(azure.container)
  environment: #@ base64.encode(azure.environment)
  #@ if azure.account_key != "":
  account_key: #@ base64.encode(azure.account_key)
  #@ end
  #@ if azure.client_id != "":
  client_id: #@ base64.encode(azure.client_id)
  #@ end
  #@ if azure.client_secret != "":
  client_secret: #@ base64.encode(azure.client_secret)
  #@ end
  #@ if azure.tenant_id != "":
  tenant_id: #@ base64.encode(azure.tenant_id)
  #@ end
#@ end
