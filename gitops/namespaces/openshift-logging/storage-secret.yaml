#@ load("@ytt:data", "data")
#@ load("@ytt:base64", "base64")

#! Loki Azure Blob Storage Secret — rendered from Vault-sourced values.
#!
#! This template creates the logging-loki-azure Secret that the LokiStack
#! operator requires to reach the Azure Storage Account where Loki stores
#! its index and chunk data.
#!
#! All credentials in this Secret are scoped to the storage account only:
#!   - account_key:    the storage account access key (standard auth)
#!   - client_id:      the SP app registration that has Storage Blob Data
#!                      Contributor on the storage account (SP auth)
#!   - client_secret:  the SP credential (SP auth)
#!   - tenant_id:      the Azure AD tenant the SP lives in (SP auth)
#!
#! These are NOT cluster-level credentials or group-sync SPs — they grant
#! access to the Loki blob container and nothing else.
#!
#! Values are injected via data.values.secrets.loki_storage at render time
#! (typically populated from Vault by the platform pipeline).
#!
#! When secrets.loki_storage.account_name is empty, this template produces
#! no output and the Secret must be created out-of-band (see
#! scripts/init-sp-auth.sh or the deploy checklist for manual creation).
#!
#! Vault path convention:
#!   secret/<team>/openshift/<cluster>/loki-storage
#!
#! Auth modes (choose one):
#!   Standard:  account_name + account_key + container + environment
#!   SP auth:   account_name + client_id + client_secret + tenant_id
#!              + container + environment

#@ azure = data.values.secrets.loki_storage
#@ blob_container = azure.container if azure.container != "" else data.values.envs[0].name + "-audit-loki"
#@ if azure.account_name != "":
---
apiVersion: v1
kind: Secret
metadata:
  name: logging-loki-azure
  namespace: openshift-logging
  labels:
    app.kubernetes.io/name: lokistack
    app.kubernetes.io/part-of: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "2"
type: Opaque
data:
  account_name: #@ base64.encode(azure.account_name)
  container: #@ base64.encode(blob_container)
  environment: #@ base64.encode(azure.environment)
  #! credentialMode static requires account_key. The operator base64-decodes
  #! the secret value and rejects it with "azure account key is not valid
  #! base64", which stops it from creating any Loki components.
  #!
  #! This manifest uses data:, so the outer base64.encode is only for
  #! Kubernetes. After that decode, a single base64 layer is still rejected.
  #! The empty-key dummy is base64(base64("unused")) before the data encoding.
  #!
  #! A real Azure account key is already one base64 layer. Leave it as
  #! returned by Azure; this template adds only the data: encoding.
  #! The dummy only has to pass the operator check. SP auth is applied
  #! afterwards by patching the generated Loki config.
  account_key: #@ base64.encode(azure.account_key if azure.account_key != "" else base64.encode(base64.encode("unused")))
  #@ if azure.client_id != "":
  client_id: #@ base64.encode(azure.client_id)
  #@ end
  #@ if azure.client_secret != "":
  client_secret: #@ base64.encode(azure.client_secret)
  #@ end
  #@ if azure.tenant_id != "":
  tenant_id: #@ base64.encode(azure.tenant_id)
  #@ end
#@ end
