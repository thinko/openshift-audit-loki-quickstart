#! Default container resource limits for openshift-logging.
#! The Loki Operator CSV does not set limits.memory on its controller-manager
#! container, which violates the namespace ResourceQuota. This LimitRange
#! auto-injects defaults so OLM-managed pods pass quota admission.
#!
#! These defaults are intentionally generous because LokiStack components
#! (ingester, compactor, querier) can need multi-GB memory for 1x.medium.
#! The operator itself OOMs at 512Mi during initial reconciliation.
#! Pods that specify their own limits in the PodSpec are unaffected.
---
apiVersion: v1
kind: LimitRange
metadata:
  name: openshift-logging-defaults
  namespace: openshift-logging
  labels:
    app.kubernetes.io/name: loki-audit
    app.kubernetes.io/part-of: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  limits:
    - type: Container
      default:
        memory: 8Gi
        cpu: "2"
      defaultRequest:
        memory: 1Gi
        cpu: 250m
