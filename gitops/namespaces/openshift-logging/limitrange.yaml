#! Default container resource limits for openshift-logging.
#! The namespace ResourceQuota requires every container to declare
#! limits.memory. This LimitRange injects generous defaults so
#! OLM-managed pods (which omit limits) pass quota admission.
#!
#! Defaults must satisfy two constraints simultaneously:
#!   1. limit >= largest per-container REQUEST the Loki Operator sets
#!      (ingester requests 13.25Gi memory, querier/query-frontend request 4 cpu)
#!   2. total_containers × limit <= namespace ResourceQuota hard limit
#!      (256Gi memory / 100 cpu)
#!
#! 1x.small has 14 pods. Worst case: 14 × 14Gi = 196Gi (under 256Gi quota).
#! The Loki Operator only sets requests, not limits — the LimitRange injects
#! limits into every Loki container. The quota was sized accordingly.
---
apiVersion: v1
kind: LimitRange
metadata:
  name: openshift-logging-defaults
  namespace: openshift-logging
  labels:
    app.kubernetes.io/name: loki-audit
    app.kubernetes.io/part-of: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  limits:
    - type: Container
      default:
        memory: 14Gi
        cpu: "8"
      defaultRequest:
        memory: 256Mi
        cpu: 100m
