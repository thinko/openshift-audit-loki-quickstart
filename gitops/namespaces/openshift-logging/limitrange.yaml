#! Default container resource limits for openshift-logging.
#! The namespace ResourceQuota requires every container to declare
#! limits.memory. This LimitRange injects generous defaults so
#! OLM-managed pods (which omit limits) pass quota admission.
#!
#! These ceilings are intentionally high — the ResourceQuota enforces
#! the aggregate total. Individual container limits must not be lower
#! than the Loki Operator's own resource requests (e.g. query-frontend
#! requests 4 cpu on 1x.small). Pods that set their own limits in
#! their PodSpec are unaffected by these defaults.
---
apiVersion: v1
kind: LimitRange
metadata:
  name: openshift-logging-defaults
  namespace: openshift-logging
  labels:
    app.kubernetes.io/name: loki-audit
    app.kubernetes.io/part-of: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  limits:
    - type: Container
      default:
        memory: 32Gi
        cpu: "16"
      defaultRequest:
        memory: 256Mi
        cpu: 100m
