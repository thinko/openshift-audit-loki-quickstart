#@data/values
---
#! Namespace ApplicationSet input (ytt data values).
#! lokistack.yaml and grafana.yaml reference these values via ytt templating.
#!
#! Before the PR: set envs[0].name to the same cluster key as clusters.yaml
#! (do not commit the filled name back to this public kit).
#! Copy org annotations / AD groups from an existing namespaces/*/values.yaml,
#! and confirm spec_hard fits the chosen LokiStack size.
#!
#! Sizing reference:
#!   1x.extra-small: requests cpu=30,  memory=64Gi   limits.memory=128Gi
#!   1x.small:       requests cpu=72,  memory=176Gi  limits.memory=256Gi
#!   1x.medium:      requests cpu=100, memory=256Gi  limits.memory=384Gi
#!
#! limits.memory MUST be set — the platform quota template defaults to 20Gi
#! when absent, which blocks pod scheduling. Set ~1.5-2× requests.memory.
#!
#! Quota enforces requests only. The Loki Operator sets requests but not
#! limits on its pods. However, the platform resourcequota.yaml template
#! defaults limits.memory to 20Gi when spec_hard.limits is absent — so we
#! MUST set spec_hard.limits.memory high enough to cover all pods in the
#! namespace. Without a LimitRange, pods without explicit limits are not
#! charged against limits quota, but the field must still exist to prevent
#! the 20Gi default from blocking scheduling.

#! ── Node placement (optional) ──────────────────────────────────────
#! On clusters with dedicated infra nodes, set nodeSelector and tolerations
#! to schedule Loki and Grafana pods on infra nodes. Leave empty ({} / [])
#! to run on any worker node (default).
#!
#! Example for standard OpenShift infra nodes:
#!   node_placement:
#!     node_selector:
#!       node-role.kubernetes.io/infra: ""
#!     tolerations:
#!       - key: node-role.kubernetes.io/infra
#!         effect: NoSchedule
#!
#! Note: log collector pods (DaemonSet) always run on ALL nodes regardless
#! of this setting — they must collect logs from every node in the cluster.
#! ── Vault-sourced secrets (injected at render time) ─────────────────
#! All secrets for the Loki deployment, sourced from a single Vault path.
#! Populate from Vault in the platform pipeline — never commit real values.
#!
#! Vault path convention: secret/<team>/openshift/<cluster>/loki-storage
#!
#! Azure storage credentials (for the blob storage account holding Loki data):
#!   These are NOT cluster-level or group-sync credentials — scoped to the
#!   Loki blob storage account only.
#!   Standard auth: account_name + account_key (storage account access key)
#!   SP auth:       account_name + client_id + client_secret + tenant_id
#!                  (SP with Storage Blob Data Contributor on the account)
#!
#! When account_name is empty (default), storage-secret.yaml produces no
#! output and the logging-loki-azure Secret must be created out-of-band.
#!
#! Grafana admin password:
#!   When set, grafana-secret.yaml renders the grafana-admin-credentials
#!   Secret. The PostSync hook detects the existing Secret and skips
#!   random password generation. When empty, the hook generates one.
#! ── Platform-injected secrets (do not remove) ───────────────────────
#! The Conjur CMP sidecar injects ALL platform secrets into every namespace
#! via /opt/secrets/conjur/secrets.yaml. That file has
#! #@overlay/match missing_ok=True on the secrets: key, which only makes
#! the secrets: key itself optional — once it matches (because we define
#! it here), ALL sibling sections must exist in this base schema.
#!
#! Our Loki templates only use secrets.loki_storage.* — every other
#! section below is unused scaffolding required so ytt overlay matching
#! succeeds. Removing any section or key breaks ArgoCD manifest generation.
#!
#! Source of truth: bootstrap/conjur/secrets.yaml in openshift-gitops repo.
#! If the Conjur template adds new keys, they must be added here too.
secrets:
  #! ── Platform credentials (from Conjur, not used by Loki) ──────────
  azure:
    client_id: ""
    client_secret: ""
    spn: ""
    log_analytics:
      workspace_shared_key: ""
  redhat:
    pull_secret: ""
  dynatrace:
    apiToken: ""
    wiz:
      clientId: ""
      clientToken: ""
  cloudability:
    apikey: ""
  ldap:
    username: ""
    password: ""
  prisma:
    image_download_key: ""
    install_bundle_base64: ""
    certs_base64: ""
  ssh:
    key:
      gitops: ""
  nexus:
    registry:
      username: ""
      password: ""
  ssl:
    key:
      api: ""
      ingress: ""
  kubeconfig: ""
  #! ── Loki deployment secrets and config (from Vault) ─────────────────
  #! All keys below are sourced from a single Vault path per cluster:
  #!   secret/<team>/openshift/<cluster>/loki-storage
  #! Injected at render time via the gitops-secrets overlay — never commit
  #! real values. Keys with non-empty defaults are safe fallbacks for when
  #! the Vault overlay is absent (homelab, sandbox bootstrap).
  loki_storage:
    #! ── Azure blob storage ──
    account_name: ""
    account_key: ""               #! real Azure key, or empty (renders a double-base64 dummy). A single-encoded placeholder is rejected.
    container: "loki-audit"
    environment: "AzureGlobal"
    client_id: ""                 #! SP app registration client ID (SP auth)
    client_secret: ""             #! SP credential (SP auth)
    tenant_id: ""                 #! Azure AD tenant for the SP (SP auth)
    #! ── Grafana ──
    grafana_admin_password: ""    #! leave empty to auto-generate via PostSync hook
    grafana_image: ""             #! container image (empty → grafana/grafana:latest)
    #! ── LokiStack sizing and operator ──
    lokistack_size: "1x.small"    #! 1x.extra-small | 1x.small | 1x.medium
    management_state: "Managed"   #! Managed (default) | Unmanaged (required for SP auth)
    storage_class: "managed-csi"  #! storageClassName for LokiStack PVCs
    #! ── ResourceQuota sizing (also used by generate-overlay.sh → envs block) ──
    requests_cpu: ""              #! e.g. "72"  — empty means use envs[0].spec_hard default
    requests_memory: ""           #! e.g. "176Gi"
    limits_memory: ""             #! e.g. "256Gi" — platform quota template requires this
    #! ── RBAC / environment identity ──
    rbac_edit: ""                 #! comma-separated AD groups for edit role
    rbac_view: ""                 #! comma-separated AD groups for view role
    deployment_id: ""             #! environment deployment identifier

node_placement:
  node_selector: {}
  tolerations: []

project:
  name: openshift-logging
  labels:
    kubernetes.io/metadata.name: openshift-logging
    argocd.argoproj.io/managed-by: "openshift-gitops"
    dt-monitoring: "true"
    openshift.io/cluster-monitoring: "true"
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    #! Empty selector: collectors and Loki pods must run on normal workers.
    #! Do not copy a dedicated-node selector from other namespace folders.
    openshift.io/node-selector: ""
    openshift.io/description: "OpenShift Logging LokiStack (audit + infrastructure)"
    openshift.io/display-name: openshift-logging
    argocd.argoproj.io/sync-wave: "1"
envs:
  - name: REPLACE_ME_CLUSTER
    rbac:
      edit: TBD
      view: TBD
    deployment_id: TBD
    spec_hard:
      requests:
        cpu: 72
        memory: 176Gi
      limits:
        memory: 256Gi
      count:
        persistentvolumeclaims: 20
