#@data/values
---
#! Namespace ApplicationSet input (ytt data values).
#! lokistack.yaml and grafana.yaml reference these values via ytt templating.
#!
#! Before the PR: set envs[0].name to the same cluster key as clusters.yaml
#! (do not commit the filled name back to this public kit).
#! Copy org annotations / AD groups from an existing namespaces/*/values.yaml,
#! and confirm spec_hard fits the chosen LokiStack size.
#!
#! Sizing reference (requests-only, no limits enforcement):
#!   1x.extra-small: spec_hard cpu=30,  memory=64Gi   (14 vCPU / 31 Gi stack)
#!   1x.small:       spec_hard cpu=72,  memory=176Gi  (34 vCPU / 67 Gi stack)
#!   1x.medium:      spec_hard cpu=100, memory=256Gi  (54 vCPU / 139 Gi stack)
#!
#! Quota enforces requests only. No limits section, no LimitRange required.
#! The Loki Operator sets requests but not limits on its pods.

#! ── Node placement (optional) ──────────────────────────────────────
#! On clusters with dedicated infra nodes, set nodeSelector and tolerations
#! to schedule Loki and Grafana pods on infra nodes. Leave empty ({} / [])
#! to run on any worker node (default).
#!
#! Example for standard OpenShift infra nodes:
#!   node_placement:
#!     node_selector:
#!       node-role.kubernetes.io/infra: ""
#!     tolerations:
#!       - key: node-role.kubernetes.io/infra
#!         effect: NoSchedule
#!
#! Note: log collector pods (DaemonSet) always run on ALL nodes regardless
#! of this setting — they must collect logs from every node in the cluster.
#! ── Vault-sourced secrets (injected at render time) ─────────────────
#! Credentials for the Azure Storage Account that holds Loki index/chunk data.
#! These are NOT cluster-level or group-sync credentials — they are scoped
#! exclusively to the Loki blob storage account.
#!
#! When account_name is empty (default), storage-secret.yaml produces no
#! output and the logging-loki-azure Secret must be created out-of-band.
#! Populate from Vault in the platform pipeline — never commit real values.
#!
#! Auth modes (choose one):
#!   Standard:  account_name + account_key (storage account access key)
#!   SP auth:   account_name + client_id + client_secret + tenant_id
#!              (SP with Storage Blob Data Contributor on the account)
secrets:
  azure_storage:
    account_name: ""
    account_key: ""               #! storage account access key (standard auth)
    container: "loki-audit"
    environment: "AzureGlobal"
    client_id: ""                 #! SP app registration client ID (SP auth)
    client_secret: ""             #! SP credential (SP auth)
    tenant_id: ""                 #! Azure AD tenant for the SP (SP auth)

node_placement:
  node_selector: {}
  tolerations: []

project:
  name: openshift-logging
  labels:
    kubernetes.io/metadata.name: openshift-logging
    argocd.argoproj.io/managed-by: "openshift-gitops"
    dt-monitoring: "true"
    openshift.io/cluster-monitoring: "true"
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    #! Empty selector: collectors and Loki pods must run on normal workers.
    #! Do not copy a dedicated-node selector from other namespace folders.
    openshift.io/node-selector: ""
    openshift.io/description: "OpenShift Logging LokiStack (audit + infrastructure)"
    openshift.io/display-name: openshift-logging
    argocd.argoproj.io/sync-wave: "1"
envs:
  - name: REPLACE_ME_CLUSTER
    rbac:
      edit: TBD
      view: TBD
    deployment_id: TBD
    spec_hard:
      requests:
        cpu: 72
        memory: 176Gi
      count:
        persistentvolumeclaims: 20
