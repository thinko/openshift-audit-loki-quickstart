#@ load("@ytt:data", "data")

#! Service Principal (SP) auth ConfigMap overlay for Loki.
#!
#! The Loki Operator does NOT support SP auth natively (see upstream
#! issue: https://github.com/grafana/loki/issues/11150). The operator
#! only generates `account_key` / `account_name` via ${ENV_VAR} refs
#! mounted from the logging-loki-azure Secret.
#!
#! To use SP auth, we must:
#!   1. Let the operator reconcile once (Managed) to create the base config
#!   2. Export the generated config.yaml
#!   3. Patch the common.storage.azure block with SP fields (literal values,
#!      NOT env var refs — the operator never mounts SP vars)
#!   4. Set managementState: Unmanaged to prevent the operator overwriting it
#!
#! Upstream reference (Go template the operator uses to generate config.yaml):
#!   https://github.com/grafana/loki/blob/main/operator/internal/manifests/internal/config/loki-config.yaml
#!
#! ╔══════════════════════════════════════════════════════════════════════╗
#! ║  TODO: This file contains a PLACEHOLDER config.yaml.               ║
#! ║  Export the real config from a running cluster:                     ║
#! ║                                                                    ║
#! ║    oc get configmap logging-loki-config -n openshift-logging \     ║
#! ║      -o jsonpath='{.data.config\.yaml}' > /tmp/loki-config.yaml   ║
#! ║                                                                    ║
#! ║  Then replace the config.yaml block below with the exported        ║
#! ║  content, and patch the common.storage.azure block to match the    ║
#! ║  azure reference below.                                            ║
#! ╚══════════════════════════════════════════════════════════════════════╝
#!
#! The config.yaml varies by LokiStack size (replica counts, limits,
#! ring settings). Export from the same size profile as the target cluster.
#! See _dev_docs/loki-config-sp-auth-reference.md for full diff analysis.

#@ azure = data.values.secrets.loki_storage
#@ sp_enabled = azure.client_id != ""

#! ── Azure block reference ──
#! The operator generates: account_name: ${AZURE_STORAGE_ACCOUNT_NAME}
#!                         account_key:  ${AZURE_STORAGE_ACCOUNT_KEY}
#! SP fields are NOT mounted as env vars, so they must be LITERAL values.
#! Our ytt template populates them from Vault via secrets.loki_storage.
#!
#! Patch every common.storage.azure block in the exported config to:
#!
#!   azure:
#!     environment:            <-- secrets.loki_storage.environment
#!     container_name:         <-- secrets.loki_storage.container
#!     account_name:           <-- secrets.loki_storage.account_name
#!     use_service_principal: true
#!     client_id:              <-- secrets.loki_storage.client_id (literal)
#!     client_secret:          <-- secrets.loki_storage.client_secret (literal)
#!     tenant_id:              <-- secrets.loki_storage.tenant_id (literal)

#! Only render when SP auth values are populated (from Vault at render time).
#! When empty, this template produces no output — SP overlay must be applied
#! manually via init-sp-auth.sh.
#@ if sp_enabled:
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logging-loki-config
  namespace: openshift-logging
  labels:
    app.kubernetes.io/name: lokistack
    app.kubernetes.io/part-of: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "4"
data:
  #! TODO: Replace this config.yaml with the full exported content.
  #! The azure block below is correctly populated from Vault — replicate
  #! it in every loki_storage_config section in the exported config.
  config.yaml: |
    ---
    auth_enabled: true
    chunk_store_config:
      chunk_cache_config:
        embedded_cache:
          enabled: true
          max_size_mb: 500
    common:
      storage:
        azure:
          environment: #@ azure.environment
          container_name: #@ azure.container
          account_name: #@ azure.account_name
          use_service_principal: true
          client_id: #@ azure.client_id
          client_secret: #@ azure.client_secret
          tenant_id: #@ azure.tenant_id
      compactor_grpc_address: logging-loki-compactor-grpc.openshift-logging.svc.cluster.local:9095
      ring:
        kvstore:
          store: memberlist
    #! TODO: The rest of the config (limits_config, memberlist, querier,
    #! query_range, schema_config, server, storage_config, tracing, etc.)
    #! must come from the exported ConfigMap. Do not fabricate it.
    #!
    #! Export with:
    #!   oc get configmap logging-loki-config -n openshift-logging \
    #!     -o jsonpath='{.data.config\.yaml}'
  runtime-config.yaml: |
    #! TODO: Export and include if present:
    #!   oc get configmap logging-loki-config -n openshift-logging \
    #!     -o jsonpath='{.data.runtime-config\.yaml}'
#@ end
