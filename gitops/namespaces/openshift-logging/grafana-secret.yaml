#@ load("@ytt:data", "data")
#@ load("@ytt:base64", "base64")

#! Grafana admin credentials Secret — rendered from Vault-sourced values.
#!
#! When secrets.loki_storage.grafana_admin_password is set, this template
#! renders the grafana-admin-credentials Secret. The PostSync hook
#! (grafana-postsync.yaml) detects the existing Secret and skips random
#! password generation.
#!
#! When grafana_admin_password is empty (default), this template produces
#! no output and the PostSync hook generates a random password instead.

#@ secrets = data.values.secrets.loki_storage
#@ if secrets.grafana_admin_password != "":
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: openshift-logging
  labels:
    app.kubernetes.io/name: loki-grafana
    app.kubernetes.io/part-of: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "5"
type: Opaque
data:
  GF_SECURITY_ADMIN_USER: #@ base64.encode("admin")
  GF_SECURITY_ADMIN_PASSWORD: #@ base64.encode(secrets.grafana_admin_password)
#@ end
