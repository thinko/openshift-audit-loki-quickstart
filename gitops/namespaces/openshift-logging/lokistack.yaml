# 1x.medium: ~54 vCPU / 139 Gi / 590 Gi WAL (operator profile).
# Object storage is Azure Blob via out-of-band secret logging-loki-azure
# (Entra workload identity / service principal, credentialMode token).
# Retention: 60 days for audit and infrastructure tenants.
---
apiVersion: loki.grafana.com/v1
kind: LokiStack
metadata:
  name: logging-loki
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: lokistack
    app.kubernetes.io/part-of: openshift-logging
spec:
  managementState: Managed
  size: 1x.medium
  storage:
    schemas:
      - version: v13
        effectiveDate: "2024-10-01"
    secret:
      name: logging-loki-azure
      type: azure
      # token = Entra app or user-assigned MI with federated credentials.
      # Loki Operator does not accept client_secret. Do not use account_key here.
      credentialMode: token
  storageClassName: managed-csi
  tenants:
    mode: openshift-logging
  limits:
    global:
      retention:
        days: 60
      queries:
        maxEntriesLimitPerQuery: 20000
        maxChunksPerQuery: 8000000
        maxQuerySeries: 2000
      ingestion:
        ingestionRate: 16
        ingestionBurstSize: 24
        maxLabelNameLength: 1024
        maxLabelValueLength: 2048
        maxLabelNamesPerSeries: 30
        maxGlobalStreamsPerTenant: 0
    tenants:
      audit:
        retention:
          days: 60
      infrastructure:
        retention:
          days: 60
        queries:
          maxEntriesLimitPerQuery: 20000
          maxQuerySeries: 2000
