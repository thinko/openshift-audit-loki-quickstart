#! 1x.small: ~34 vCPU / 67 Gi requests (operator profile). Suitable for test/staging.
#! Change size to match the target environment (see docs/scaling-guide.md):
#!   1x.extra-small  (sandbox)  |  1x.small (test)  |  1x.medium (prod)
#!
#! Object storage is Azure Blob via out-of-band secret logging-loki-azure.
#! credentialMode static: operator-valid secret (account_name + account_key).
#!
#! managementState:
#!   Managed   — default. Operator reconciles all Loki components.
#!   Unmanaged — use when SP auth overlay is applied (prevents operator from
#!               overwriting the patched ConfigMap). See loki-config-sp-overlay.yaml
#!               and scripts/init-sp-auth.sh for the bootstrap process.
#!
#! Retention: 60 days for audit and infrastructure tenants.
---
apiVersion: loki.grafana.com/v1
kind: LokiStack
metadata:
  name: logging-loki
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/name: lokistack
    app.kubernetes.io/part-of: openshift-logging
spec:
  managementState: Managed
  size: 1x.small
  storage:
    schemas:
      - version: v13
        effectiveDate: "2024-10-01"
    secret:
      name: logging-loki-azure
      type: azure
      credentialMode: static
  storageClassName: managed-csi
  tenants:
    mode: openshift-logging
  limits:
    global:
      retention:
        days: 60
      queries:
        maxEntriesLimitPerQuery: 20000
        maxChunksPerQuery: 8000000
        maxQuerySeries: 2000
      ingestion:
        ingestionRate: 16
        ingestionBurstSize: 24
        maxLabelNameLength: 1024
        maxLabelValueLength: 2048
        maxLabelNamesPerSeries: 30
        maxGlobalStreamsPerTenant: 0
    tenants:
      audit:
        retention:
          days: 60
      infrastructure:
        retention:
          days: 60
        queries:
          maxEntriesLimitPerQuery: 20000
          maxQuerySeries: 2000
