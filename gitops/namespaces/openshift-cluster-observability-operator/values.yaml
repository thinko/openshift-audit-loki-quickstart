#@data/values
---
#! Namespace ApplicationSet input for the Cluster Observability Operator.
#! This folder has no ytt templates, so it does not declare secrets or
#! node_placement. The Conjur overlay skips secrets when the key is absent.
#! Defining secrets here would require every platform secret key.
project:
  name: openshift-cluster-observability-operator
  labels:
    kubernetes.io/metadata.name: openshift-cluster-observability-operator
    argocd.argoproj.io/managed-by: "openshift-gitops"
    openshift.io/cluster-monitoring: "true"
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    openshift.io/node-selector: ""
    openshift.io/description: "Cluster Observability Operator (UIPlugin CRD)"
    openshift.io/display-name: openshift-cluster-observability-operator
    argocd.argoproj.io/sync-wave: "1"
envs:
  - name: REPLACE_ME_CLUSTER
    rbac:
      edit: TBD
      view: TBD
    deployment_id: TBD
    spec_hard:
      requests:
        cpu: 2
        memory: 4Gi
      limits:
        memory: 8Gi
