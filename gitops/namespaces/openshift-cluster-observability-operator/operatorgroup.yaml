#! AllNamespaces mode. The COO CSV does not support OwnNamespace — it
#! creates cluster-scoped ConsolePlugins and must watch all namespaces.
#!
#! OLM allows one AllNamespaces OperatorGroup per namespace, not per
#! cluster. openshift-operators has its own; this namespace has ours.
#! They do not conflict because they are in different namespaces.
#!
#! Do not put this OperatorGroup in openshift-logging. That namespace
#! already has one, and a second OperatorGroup breaks OLM.
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-cluster-observability-operator
  namespace: openshift-cluster-observability-operator
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  upgradeStrategy: Default
