#! Cluster Observability Operator. Provides the UIPlugin CRD used by
#! namespaces/openshift-logging/uiplugin.yaml.
#!
#! Confirm the channel exists before merge:
#!   oc get packagemanifest cluster-observability-operator -n openshift-marketplace \
#!     -o jsonpath='{range .status.channels[*]}{.name}{"\n"}{end}'
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: cluster-observability-operator
  namespace: openshift-cluster-observability-operator
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  channel: stable
  installPlanApproval: Automatic
  name: cluster-observability-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
